name: Link check

# Notes cross-reference each other heavily. A rename that breaks 40 links
# should fail loudly rather than rot quietly.

on:
  push:
    branches: [main]
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1" # Mondays, to catch external link rot
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 is accepted deliberately. Publisher sites (O'Reilly, Manning,
          # deeplearning.ai) sit behind bot protection and return 403 to any
          # non-browser client — the link is fine, the crawler is unwelcome.
          # Treating that as a broken link fails the build on healthy URLs.
          # 429 is rate limiting, likewise not a broken link.
          #
          # A real 404 or a DNS failure still fails the build, which is the
          # case this check exists for.
          args: >-
            --no-progress
            --accept 200,203,204,206,403,429
            --user-agent 'Mozilla/5.0 (compatible; lychee link checker; +https://github.com/lycheeverse/lychee)'
            --max-concurrency 8
            --max-retries 2
            --timeout 20
            --exclude-path library
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude 'example\.com'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
