name: Update progress

# When you tick a checkbox in ROADMAP.md and push, this regenerates
# PROGRESS.md and the README progress table and commits the result.

on:
  push:
    branches: [main]
    paths:
      - "ROADMAP.md"
      - "scripts/build_progress.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild progress
        run: python scripts/build_progress.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- PROGRESS.md README.md; then
            echo "Progress unchanged."
            exit 0
          fi
          git add PROGRESS.md README.md
          git commit -m "chore: refresh progress [skip ci]"
          git push
