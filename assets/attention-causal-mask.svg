<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="amt amd">
  <title id="amt">Causal masking, step by step</title>
  <desc id="amd">Three stages animate in sequence. First a full 5 by 5 matrix of raw attention scores. Then the upper triangle is set to negative infinity, hiding future positions. Then softmax turns each row into weights that sum to one, with the masked cells at exactly zero. The mask is applied to the scores before the softmax, which is what keeps each row normalised.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fg { fill: #24292f; } .mut { fill: #57606a; }
    .box { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; } .mut { fill: #8b949e; }
      .box { stroke: #30363d; }
    }
    .t    { font-size: 15px; font-weight: 600; }
    .st   { font-size: 11.5px; }
    .stg  { font-size: 12.5px; font-weight: 600; }
    .tick { font-size: 10px; }
    .cellv{ font-size: 10px; fill: #ffffff; font-weight: 600; }

    /* 9s loop: three 3s stages. */
    .p1,.p2,.p3,.inf,.wt { animation-duration: 9s; animation-iteration-count: infinite; }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    @keyframes p1 { 0%{opacity:1} 30%{opacity:1} 34%{opacity:.12} 100%{opacity:.12} }
    @keyframes p2 { 0%{opacity:.12} 30%{opacity:.12} 34%{opacity:1} 64%{opacity:1} 68%{opacity:.12} 100%{opacity:.12} }
    @keyframes p3 { 0%{opacity:.12} 64%{opacity:.12} 68%{opacity:1} 100%{opacity:1} }

    /* the -inf overlay sweeps in during stage 2 */
    .inf { animation-name: inf; }
    @keyframes inf { 0%,30%{opacity:0} 40%{opacity:1} 100%{opacity:1} }

    /* softmax weights fade in during stage 3 */
    .wt { animation-name: wt; }
    @keyframes wt { 0%,64%{opacity:0} 74%,100%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .p1 { animation: none; opacity: .12; }
      .p2 { animation: none; opacity: .12; }
      .p3, .inf, .wt { animation: none; opacity: 1; }
    }
  </style>

  <text x="24" y="28" class="t fg">Causal masking — mask the scores, then softmax</text>
  <text x="24" y="48" class="st mut">Masking after the softmax leaves the rows un-normalised. Setting scores to −∞ first means exp(−∞) = 0, so the softmax normalises over only the visible positions.</text>

  <!-- stage captions -->
  <text x="90"  y="86" class="stg fg p1" text-anchor="middle">1 · raw scores  QKᵀ/√d</text>
  <text x="330" y="86" class="stg fg p2" text-anchor="middle">2 · mask the future with −∞</text>
  <text x="580" y="86" class="stg fg p3" text-anchor="middle">3 · softmax → rows sum to 1</text>

  <!-- ══ stage 1: full score matrix ══ -->
  <g class="p1">
    <g fill="#3b82f6">
      <rect x="30" y="100" width="24" height="24" rx="3" opacity=".85"/><rect x="56" y="100" width="24" height="24" rx="3" opacity=".45"/><rect x="82" y="100" width="24" height="24" rx="3" opacity=".70"/><rect x="108" y="100" width="24" height="24" rx="3" opacity=".35"/><rect x="134" y="100" width="24" height="24" rx="3" opacity=".60"/>
      <rect x="30" y="126" width="24" height="24" rx="3" opacity=".40"/><rect x="56" y="126" width="24" height="24" rx="3" opacity=".90"/><rect x="82" y="126" width="24" height="24" rx="3" opacity=".30"/><rect x="108" y="126" width="24" height="24" rx="3" opacity=".75"/><rect x="134" y="126" width="24" height="24" rx="3" opacity=".50"/>
      <rect x="30" y="152" width="24" height="24" rx="3" opacity=".65"/><rect x="56" y="152" width="24" height="24" rx="3" opacity=".35"/><rect x="82" y="152" width="24" height="24" rx="3" opacity=".85"/><rect x="108" y="152" width="24" height="24" rx="3" opacity=".55"/><rect x="134" y="152" width="24" height="24" rx="3" opacity=".45"/>
      <rect x="30" y="178" width="24" height="24" rx="3" opacity=".50"/><rect x="56" y="178" width="24" height="24" rx="3" opacity=".70"/><rect x="82" y="178" width="24" height="24" rx="3" opacity=".40"/><rect x="108" y="178" width="24" height="24" rx="3" opacity=".88"/><rect x="134" y="178" width="24" height="24" rx="3" opacity=".60"/>
      <rect x="30" y="204" width="24" height="24" rx="3" opacity=".55"/><rect x="56" y="204" width="24" height="24" rx="3" opacity=".45"/><rect x="82" y="204" width="24" height="24" rx="3" opacity=".65"/><rect x="108" y="204" width="24" height="24" rx="3" opacity=".35"/><rect x="134" y="204" width="24" height="24" rx="3" opacity=".90"/>
    </g>
    <text x="94" y="252" class="tick mut" text-anchor="middle">every position sees every other</text>
  </g>

  <!-- ══ stage 2: masked ══ -->
  <g class="p2">
    <g fill="#3b82f6">
      <rect x="270" y="100" width="24" height="24" rx="3" opacity=".85"/>
      <rect x="270" y="126" width="24" height="24" rx="3" opacity=".40"/><rect x="296" y="126" width="24" height="24" rx="3" opacity=".90"/>
      <rect x="270" y="152" width="24" height="24" rx="3" opacity=".65"/><rect x="296" y="152" width="24" height="24" rx="3" opacity=".35"/><rect x="322" y="152" width="24" height="24" rx="3" opacity=".85"/>
      <rect x="270" y="178" width="24" height="24" rx="3" opacity=".50"/><rect x="296" y="178" width="24" height="24" rx="3" opacity=".70"/><rect x="322" y="178" width="24" height="24" rx="3" opacity=".40"/><rect x="348" y="178" width="24" height="24" rx="3" opacity=".88"/>
      <rect x="270" y="204" width="24" height="24" rx="3" opacity=".55"/><rect x="296" y="204" width="24" height="24" rx="3" opacity=".45"/><rect x="322" y="204" width="24" height="24" rx="3" opacity=".65"/><rect x="348" y="204" width="24" height="24" rx="3" opacity=".35"/><rect x="374" y="204" width="24" height="24" rx="3" opacity=".90"/>
    </g>
    <!-- the -inf upper triangle -->
    <g class="inf" fill="#f43f5e" opacity="0">
      <rect x="296" y="100" width="24" height="24" rx="3" opacity=".25"/><rect x="322" y="100" width="24" height="24" rx="3" opacity=".25"/><rect x="348" y="100" width="24" height="24" rx="3" opacity=".25"/><rect x="374" y="100" width="24" height="24" rx="3" opacity=".25"/>
      <rect x="322" y="126" width="24" height="24" rx="3" opacity=".25"/><rect x="348" y="126" width="24" height="24" rx="3" opacity=".25"/><rect x="374" y="126" width="24" height="24" rx="3" opacity=".25"/>
      <rect x="348" y="152" width="24" height="24" rx="3" opacity=".25"/><rect x="374" y="152" width="24" height="24" rx="3" opacity=".25"/>
      <rect x="374" y="178" width="24" height="24" rx="3" opacity=".25"/>
      <text x="308" y="116" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="334" y="116" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="360" y="116" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="386" y="116" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="334" y="142" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="360" y="142" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="386" y="142" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="360" y="168" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="386" y="168" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
      <text x="386" y="194" class="cellv" text-anchor="middle" fill="#f43f5e">−∞</text>
    </g>
    <text x="334" y="252" class="tick mut" text-anchor="middle">position i may attend only to j ≤ i</text>
  </g>

  <!-- ══ stage 3: softmax weights ══ -->
  <g class="p3">
    <g fill="#14b8a6">
      <rect x="520" y="100" width="24" height="24" rx="3" opacity="1"/>
      <rect x="520" y="126" width="24" height="24" rx="3" opacity=".31"/><rect x="546" y="126" width="24" height="24" rx="3" opacity=".69"/>
      <rect x="520" y="152" width="24" height="24" rx="3" opacity=".38"/><rect x="546" y="152" width="24" height="24" rx="3" opacity=".22"/><rect x="572" y="152" width="24" height="24" rx="3" opacity=".40"/>
      <rect x="520" y="178" width="24" height="24" rx="3" opacity=".21"/><rect x="546" y="178" width="24" height="24" rx="3" opacity=".28"/><rect x="572" y="178" width="24" height="24" rx="3" opacity=".18"/><rect x="598" y="178" width="24" height="24" rx="3" opacity=".33"/>
      <rect x="520" y="204" width="24" height="24" rx="3" opacity=".19"/><rect x="546" y="204" width="24" height="24" rx="3" opacity=".16"/><rect x="572" y="204" width="24" height="24" rx="3" opacity=".22"/><rect x="598" y="204" width="24" height="24" rx="3" opacity=".13"/><rect x="624" y="204" width="24" height="24" rx="3" opacity=".30"/>
    </g>
    <!-- zeros where the mask was -->
    <g class="box" fill="none" stroke-dasharray="2 2">
      <rect x="546" y="100" width="24" height="24" rx="3"/><rect x="572" y="100" width="24" height="24" rx="3"/><rect x="598" y="100" width="24" height="24" rx="3"/><rect x="624" y="100" width="24" height="24" rx="3"/>
      <rect x="572" y="126" width="24" height="24" rx="3"/><rect x="598" y="126" width="24" height="24" rx="3"/><rect x="624" y="126" width="24" height="24" rx="3"/>
      <rect x="598" y="152" width="24" height="24" rx="3"/><rect x="624" y="152" width="24" height="24" rx="3"/>
      <rect x="624" y="178" width="24" height="24" rx="3"/>
    </g>
    <g class="wt">
      <text x="672" y="116" class="tick mut">= 1.00</text>
      <text x="672" y="142" class="tick mut">= 1.00</text>
      <text x="672" y="168" class="tick mut">= 1.00</text>
      <text x="672" y="194" class="tick mut">= 1.00</text>
      <text x="672" y="220" class="tick mut">= 1.00</text>
    </g>
    <text x="584" y="252" class="tick mut" text-anchor="middle">masked cells are exactly 0; every row still sums to 1</text>
  </g>

  <text x="24" y="296" class="st mut">The classic bug is zeroing the weights <tspan font-style="italic">after</tspan> the softmax. The rows then sum to less than one, quietly rescaling every value vector.</text>
  <text x="24" y="316" class="st mut">Verified in tests/test_attention.py — test_attention_weights_sum_to_one and test_causal_mask_zeroes_the_future.</text>
  <text x="24" y="340" class="tick mut">Raschka ch. 3 · Alammar ch. 3 · Géron ch. 16</text>
</svg>
