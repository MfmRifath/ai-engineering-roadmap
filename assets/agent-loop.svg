<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="alt ald">
  <title id="alt">The agent loop and the guards it needs</title>
  <desc id="ald">A cycle of four stages animates: the model thinks, your harness validates and dispatches a tool, the tool result is returned as an observation, and the loop repeats until the model stops requesting tools. A travelling dot shows the direction of flow. Around the cycle sit the guards that make it survivable in production: a step cap, a cost budget, a wall-clock timeout, loop detection, and least-privilege tool scoping. The key point is that the model never executes anything; it emits a request and the harness decides.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fg { fill: #24292f; } .mut { fill: #57606a; }
    .ring { stroke: #57606a; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; } .mut { fill: #8b949e; }
      .ring { stroke: #8b949e; }
    }
    .t    { font-size: 15px; font-weight: 600; }
    .st   { font-size: 11.5px; }
    .node { font-size: 13px; font-weight: 600; }
    .tick { font-size: 10.5px; }
    .guard{ font-size: 11px; font-weight: 600; }

    .orbit { animation: orbit 6s linear infinite; }
    @keyframes orbit { 0% { offset-distance: 0% } 100% { offset-distance: 100% } }

    .lit { animation: lit 6s linear infinite; }
    @keyframes lit { 0%,8%{opacity:1} 25%,100%{opacity:.35} }

    .d1 { animation-delay: 0s }   .d2 { animation-delay: -4.5s }
    .d3 { animation-delay: -3s }  .d4 { animation-delay: -1.5s }

    @media (prefers-reduced-motion: reduce) {
      .orbit { animation: none; opacity: 0; }
      .lit { animation: none; opacity: 1; }
    }
  </style>

  <text x="24" y="28" class="t fg">The agent loop — and the guards that make it survivable</text>
  <text x="24" y="48" class="st mut">The model never executes anything. It emits a structured request; your harness validates, authorises, and runs it. Every security property lives in the harness.</text>

  <!-- the cycle path -->
  <path id="cyc" d="M 300 120 A 110 90 0 1 1 299.9 120" fill="none" class="ring" stroke-width="1.5" stroke-dasharray="5 5" opacity=".45"/>

  <!-- arrowhead marker -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- nodes -->
  <g class="lit d1">
    <rect x="228" y="98" width="148" height="44" rx="10" fill="#3b82f6" opacity=".2"/>
    <text x="302" y="120" class="node fg" text-anchor="middle">1 · think</text>
    <text x="302" y="135" class="tick mut" text-anchor="middle">model picks a tool</text>
  </g>

  <g class="lit d2">
    <rect x="392" y="188" width="148" height="44" rx="10" fill="#f43f5e" opacity=".2"/>
    <text x="466" y="210" class="node fg" text-anchor="middle">2 · dispatch</text>
    <text x="466" y="225" class="tick mut" text-anchor="middle">YOUR code validates + runs</text>
  </g>

  <g class="lit d3">
    <rect x="228" y="278" width="148" height="44" rx="10" fill="#14b8a6" opacity=".2"/>
    <text x="302" y="300" class="node fg" text-anchor="middle">3 · observe</text>
    <text x="302" y="315" class="tick mut" text-anchor="middle">result back into context</text>
  </g>

  <g class="lit d4">
    <rect x="64" y="188" width="148" height="44" rx="10" fill="#a855f7" opacity=".2"/>
    <text x="138" y="210" class="node fg" text-anchor="middle">4 · repeat?</text>
    <text x="138" y="225" class="tick mut" text-anchor="middle">no tool call → done</text>
  </g>

  <!-- travelling dot -->
  <circle r="6" fill="#f59e0b" class="orbit" style="offset-path: path('M 302 142 A 110 90 0 1 1 301.9 142');"/>

  <!-- guards panel -->
  <rect x="566" y="86" width="212" height="252" rx="10" fill="#f59e0b" opacity=".1"/>
  <rect x="566" y="86" width="212" height="252" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity=".5"/>
  <text x="584" y="112" class="guard fg">Guards — all mandatory</text>

  <text x="584" y="140" class="tick fg">▪ step cap</text>
  <text x="596" y="155" class="tick mut">the classic runaway</text>

  <text x="584" y="178" class="tick fg">▪ cost budget</text>
  <text x="596" y="193" class="tick mut">the classic surprise invoice</text>

  <text x="584" y="216" class="tick fg">▪ wall-clock timeout</text>
  <text x="596" y="231" class="tick mut">step caps don't catch a stall</text>

  <text x="584" y="254" class="tick fg">▪ loop detection</text>
  <text x="596" y="269" class="tick mut">tell the agent, don't abort</text>

  <text x="584" y="292" class="tick fg">▪ least privilege</text>
  <text x="596" y="307" class="tick mut">the only structural defense</text>

  <text x="584" y="330" class="tick mut">aieng/agents/loop.py</text>

  <!-- bottom note -->
  <text x="24" y="368" class="st mut">Compounding failure is the constraint: ten steps at 95% each succeed 60% of the time end to end. Most production "agents" are constrained</text>
  <text x="24" y="386" class="st mut">workflows with one or two model decision points — and that is a feature, not a compromise.</text>
</svg>
