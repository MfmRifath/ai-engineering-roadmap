<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
  <title id="t">Compounding reliability across sequential steps</title>
  <desc id="d">Success rate falls multiplicatively with step count. At 95% per step, ten steps end to end succeed only 60% of the time.</desc>

  <style>
    .fg   { fill: #24292f; }
    .mut  { fill: #57606a; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 3; opacity: .6; }
    .rule { stroke: #f43f5e; stroke-width: 1.5; stroke-dasharray: 5 3; }
    @media (prefers-color-scheme: dark) {
      .fg   { fill: #e6edf3; }
      .mut  { fill: #8b949e; }
      .axis { stroke: #30363d; }
      .grid { stroke: #30363d; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t   { font-size: 15px; font-weight: 600; }
    .st  { font-size: 11.5px; }
    .lbl { font-size: 12px; }
    .val { font-size: 12px; font-weight: 600; }
    .tick{ font-size: 10.5px; }

    .bar { transform-origin: left center; animation: grow .9s cubic-bezier(.22,1,.36,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .ln { stroke-dasharray: 1200; stroke-dashoffset: 1200;
          animation: draw 1.6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .bar, .ln, .fade { animation: none; opacity: 1;
                         stroke-dashoffset: 0; transform: none; }
    }
  </style>
  <text x="24.0" y="30.0" class="t fg" text-anchor="start">Compounding reliability</text>
  <text x="24.0" y="50.0" class="st mut" text-anchor="start">Per-step success multiplies. This is the constraint on every multi-step LLM system.</text>
  <line x1="70" y1="265.0" x2="710" y2="265.0" class="grid"/>
  <text x="60.0" y="269.0" class="tick mut" text-anchor="end">0%</text>
  <line x1="70" y1="216.2" x2="710" y2="216.2" class="grid"/>
  <text x="60.0" y="220.2" class="tick mut" text-anchor="end">25%</text>
  <line x1="70" y1="167.5" x2="710" y2="167.5" class="grid"/>
  <text x="60.0" y="171.5" class="tick mut" text-anchor="end">50%</text>
  <line x1="70" y1="118.8" x2="710" y2="118.8" class="grid"/>
  <text x="60.0" y="122.8" class="tick mut" text-anchor="end">75%</text>
  <line x1="70" y1="70.0" x2="710" y2="70.0" class="grid"/>
  <text x="60.0" y="74.0" class="tick mut" text-anchor="end">100%</text>
  <line x1="70" y1="265" x2="710" y2="265" class="axis"/>
  <text x="70.0" y="285.0" class="tick mut" text-anchor="middle">1</text>
  <text x="204.7" y="285.0" class="tick mut" text-anchor="middle">5</text>
  <text x="373.2" y="285.0" class="tick mut" text-anchor="middle">10</text>
  <text x="541.6" y="285.0" class="tick mut" text-anchor="middle">15</text>
  <text x="710.0" y="285.0" class="tick mut" text-anchor="middle">20</text>
  <text x="390.0" y="305.0" class="tick mut" text-anchor="middle">sequential steps</text>
  <polyline points="70.0,71.9 103.7,73.9 137.4,75.8 171.1,77.7 204.7,79.6 238.4,81.4 272.1,83.2 305.8,85.1 339.5,86.9 373.2,88.6 406.8,90.4 440.5,92.2 474.2,93.9 507.9,95.6 541.6,97.3 575.3,99.0 608.9,100.6 642.6,102.3 676.3,103.9 710.0,105.5" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" class="ln" style="animation-delay:0.00s"/>
  <text x="718.0" y="109.5" class="tick" text-anchor="start" fill="#22c55e">99% per step</text>
  <polyline points="70.0,79.8 103.7,89.0 137.4,97.8 171.1,106.2 204.7,114.1 238.4,121.7 272.1,128.8 305.8,135.6 339.5,142.1 373.2,148.2 406.8,154.1 440.5,159.6 474.2,164.9 507.9,169.9 541.6,174.7 575.3,179.2 608.9,183.5 642.6,187.5 676.3,191.4 710.0,195.1" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" class="ln" style="animation-delay:0.15s"/>
  <text x="718.0" y="199.1" class="tick" text-anchor="start" fill="#f59e0b">95% per step</text>
  <polyline points="70.0,89.5 103.7,107.0 137.4,122.8 171.1,137.1 204.7,149.9 238.4,161.4 272.1,171.7 305.8,181.1 339.5,189.5 373.2,197.0 406.8,203.8 440.5,209.9 474.2,215.4 507.9,220.4 541.6,224.9 575.3,228.9 608.9,232.5 642.6,235.7 676.3,238.7 710.0,241.3" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" class="ln" style="animation-delay:0.30s"/>
  <text x="718.0" y="245.3" class="tick" text-anchor="start" fill="#f43f5e">90% per step</text>
  <circle cx="373.2" cy="148.2" r="5" fill="#f59e0b" class="fade" style="animation-delay:1.5s"/>
  <text x="383.2" y="138.2" class="val fg fade" text-anchor="start" style="animation-delay:1.60s">10 steps at 95% = 60%</text>
</svg>
