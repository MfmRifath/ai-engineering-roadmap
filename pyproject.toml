[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aieng"
version = "0.1.0"
description = "A library that accretes across the AI Engineering roadmap — classical ML, transformers from scratch, RAG, evals, and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rifath" }]
keywords = ["machine-learning", "llm", "transformers", "rag", "agents", "ai-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately tiny core. Everything heavy is an optional extra so that
# `pip install -e .` stays fast and CI does not pull a 2 GB CUDA wheel.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Phase 1-2 — Geron
classic = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
]
# Phase 3-5 — Alammar, Raschka
llm = [
    "torch>=2.1",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "datasets>=2.18",
    "tiktoken>=0.6",
    "accelerate>=0.30",
]
# Phase 5-6 — fine-tuning
finetune = [
    "peft>=0.11",
    "sentence-transformers>=3.0",
    "trl>=0.9",
]
# Phase 6 — RAG
rag = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
]
# Phase 6 — serving
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]
# Phase 7-8 — agents
agents = [
    "anthropic>=0.34",
    "openai>=1.30",
]
# The interactive study app — local, offline, no LLM
study = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "markdown-it-py>=3.0",   # pure python, renders the notes for the in-app reader
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # fastapi TestClient
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "nbstripout>=0.7",
]
all = [
    "aieng[classic,llm,finetune,rag,serving,agents,study,dev]",
]

[project.urls]
Homepage = "https://github.com/MfmRifath/ai-engineering-roadmap"
Roadmap = "https://github.com/MfmRifath/ai-engineering-roadmap/blob/main/ROADMAP.md"

[project.scripts]
aieng-progress = "aieng.cli:progress_main"
aieng-study = "aieng.study.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aieng = ["py.typed", "study/web/*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
# Never touch the chapter notes. Their Python snippets are hand-formatted for
# reading — mirroring how the books lay the code out — and reflowing them to
# machine style makes them worse and makes `make lint` fail after every note edit.
extend-exclude = ["*.md", "library", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg — common and fine in FastAPI
    "RUF001", # ambiguous unicode in strings (we use proper math symbols in docstrings)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# doctor.py deliberately checks the running interpreter's version. Ruff sees a
# comparison against the project's minimum and calls it dead code — but this is
# the one script whose entire job is to run on the *wrong* interpreter and say so.
"scripts/doctor.py" = ["UP036"]
"scripts/*" = ["C4"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download models or train — excluded from CI by default",
    "torch: requires PyTorch",
    "network: requires network access",
]
filterwarnings = ["ignore::DeprecationWarning"]
